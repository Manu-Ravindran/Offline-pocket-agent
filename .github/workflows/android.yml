name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialize-signing:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize encrypted release key when signing is configured
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$ANDROID_SIGNING_PASSWORD" ]; then
            python3 ci/prepare_signing.py bootstrap
          else
            echo 'Release signing is not configured. This run provides a parallel-install preview and an unsigned release.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: initialize-signing
    if: always() && (needs.initialize-signing.result == 'success' || needs.initialize-signing.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch pinned on-device inference SDK
        shell: bash
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            'https://github.com/qualcomm/GenieX/releases/download/v0.9.3/geniex-android-aar-v0.9.3.aar' \
            --output app/libs/geniex-android-v0.9.3.aar
          echo '224c81687ca1a24491a6a5c05000eb7af22821f0d1bca251ea6e0e4e9291a3cd  app/libs/geniex-android-v0.9.3.aar' | sha256sum --check
      - name: Prepare persistent release signing on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$ANDROID_SIGNING_PASSWORD" ]; then
            python3 ci/prepare_signing.py prepare
          fi
      - name: Check CI security controls
        run: python3 -m unittest discover -s ci -p 'test_*.py'
      - name: Test, check, and build both variants
        run: gradle --no-daemon --continue testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease
      - name: Check packaged security settings
        shell: bash
        run: |
          apkanalyzer manifest print app/build/outputs/apk/debug/app-debug.apk > /tmp/pocket-agent-preview-manifest.xml
          python3 ci/check_apk_security.py /tmp/pocket-agent-preview-manifest.xml --release
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          apkanalyzer manifest print "$release_apk" > /tmp/pocket-agent-release-manifest.xml
          python3 ci/check_apk_security.py /tmp/pocket-agent-release-manifest.xml --release
          if [ "${POCKET_SIGNING_READY:-}" = 'true' ]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$release_apk"
          fi
      - name: Upload parallel-install preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pocket-agent-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed release
        if: env.POCKET_SIGNING_READY == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pocket-agent-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release for signing setup
        if: env.POCKET_SIGNING_READY != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pocket-agent-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: python3 ci/prepare_signing.py cleanup
